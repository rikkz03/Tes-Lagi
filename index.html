<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special For You ❤️</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    /* Background floating hearts */
    .bg-heart {
      position: absolute;
      color: rgba(255, 255, 255, 0.4);
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      z-index: 1;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) scale(0.5);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) scale(1.3);
        opacity: 0;
      }
    }

    /* Container Card */
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(220, 90, 120, 0.2);
      text-align: center;
      max-width: 400px;
      width: 90%;
      z-index: 10;
      transition: all 0.5s ease;
      border: 2px solid rgba(255, 255, 255, 0.6);
    }

    h1 {
      color: #e63946;
      font-size: 1.8rem;
      margin-bottom: 15px;
    }

    p {
      color: #4a4a4a;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 15px;
      position: relative;
      min-height: 50px;
    }

    button {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.3s;
    }

    .btn-yes {
      background-color: #ff4b72;
      color: white;
      box-shadow: 0 5px 15px rgba(255, 75, 114, 0.4);
    }

    .btn-yes:hover {
      transform: scale(1.08);
      background-color: #e03056;
    }

    .btn-no {
      background-color: #a8a8a8;
      color: white;
      position: absolute;
      right: 20px;
    }

    /* Large Heart Canvas Container */
    .heart-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      animation: fadeIn 1s forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Glowing Pulsing Big Heart */
    .big-heart {
      position: relative;
      width: 140px;
      height: 140px;
      background-color: #ff2a5f;
      transform: rotate(-45deg);
      animation: pulse 1.2s infinite;
      box-shadow: 0 0 40px #ff2a5f, 0 0 80px #ff2a5f;
      margin: 60px 0 40px 0;
    }

    .big-heart::before,
    .big-heart::after {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      background-color: #ff2a5f;
      border-radius: 50%;
    }

    .big-heart::before {
      top: -70px;
      left: 0;
    }

    .big-heart::after {
      left: 70px;
      top: 0;
    }

    @keyframes pulse {
      0% {
        transform: rotate(-45deg) scale(1);
      }
      50% {
        transform: rotate(-45deg) scale(1.15);
      }
      100% {
        transform: rotate(-45deg) scale(1);
      }
    }

    .love-text {
      color: #ff2a5f;
      font-size: 2rem;
      font-weight: 800;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
      margin-top: 20px;
    }

    .sub-text {
      color: #555;
      font-size: 1.1rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Floating background elements generated by JS -->

  <!-- Card Pertama: Gombalan / Pertanyaan -->
  <div class="card" id="card">
    <h1 id="title">Hai Sayang... ❤️</h1>
    <p id="message">Aku cuma mau bilang, dari sekian banyak hal manis di dunia ini, senyum kamu tetap jadi yang favorit buat aku. Kamu tau gak knapa?</p>
    
    <div class="btn-group" id="btnGroup">
      <button class="btn-yes" onclick="nextStep()">Kenapa tuh? 🥺</button>
    </div>
  </div>

  <!-- Container Akhir: Love Besar -->
  <div class="heart-container" id="heartContainer">
    <div class="big-heart"></div>
    <div class="love-text">I LOVE YOU SO MUCH! ❤️</div>
    <div class="sub-text">Makasih udah hadir dan bikin hari-hariku selalu berwarna. 🥰</div>
  </div>

  <script>
    // Bikin partikel hati terbang di background
    function createBgHearts() {
      const heartArr = ['❤️', '💖', '💕', '💗', '🌸'];
      for (let i = 0; i < 25; i++) {
        let heart = document.createElement('div');
        heart.className = 'bg-heart';
        heart.innerText = heartArr[Math.floor(Math.random() * heartArr.length)];
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
        heart.style.animationDelay = Math.random() * 5 + 's';
        heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
        document.body.appendChild(heart);
      }
    }
    createBgHearts();

    let step = 0;
    const title = document.getElementById('title');
    const message = document.getElementById('message');
    const btnGroup = document.getElementById('btnGroup');

    function nextStep() {
      step++;
      if (step === 1) {
        title.innerText = "Soalnya... ✨";
        message.innerText = "Tiap kali liat kamu senyum, rasanya kaya dapet recharge energi instan. Jangan pernah bosen sama aku ya?";
        btnGroup.innerHTML = `
          <button class="btn-yes" onclick="nextStep()">Nggak akan! 🥰</button>
        `;
      } else if (step === 2) {
        title.innerText = "Satu Pertanyaan Penting 🙈";
        message.innerText = "Boleh gak kalau aku minta kamu buat tetep di samping aku selamanya?";
        btnGroup.style.justify = 'flex-start';
        btnGroup.innerHTML = `
          <button class="btn-yes" onclick="showLove()">Boleh Banget! ❤️</button>
          <button class="btn-no" id="btnNo" onmouseover="moveButton()" onclick="moveButton()">Nggak 😜</button>
        `;
      }
    }

    // Fungsi biar tombol "Nggak" kabur
    function moveButton() {
      const btnNo = document.getElementById('btnNo');
      const card = document.getElementById('card');
      
      const cardRect = card.getBoundingClientRect();
      const btnRect = btnNo.getBoundingClientRect();

      // Hitung posisi acak di dalam area kartu
      const maxX = cardRect.width - btnRect.width - 20;
      const maxY = cardRect.height - btnRect.height - 20;

      const randomX = Math.floor(Math.random() * maxX) - (cardRect.width / 2 - 50);
      const randomY = Math.floor(Math.random() * maxY) - (cardRect.height / 2 - 20);

      btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

    // Fungsi untuk menampilkan Love Besar di akhir
    function showLove() {
      document.getElementById('card').style.display = 'none';
      document.getElementById('heartContainer').style.display = 'flex';
      
      // Tambah efek partikel cinta ekstra saat love besar muncul
      for (let i = 0; i < 40; i++) {
        setTimeout(createBgHearts, i * 50);
      }
    }
  </script>
</body>
</html>
